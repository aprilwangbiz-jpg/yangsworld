# Free-plan Supabase pauses after ~7 days with no activity. A tiny read every
# 3 days resets that timer. Reuses the same Actions variables as deploy.yml.
name: Keep Supabase awake

on:
  schedule:
    - cron: "0 9 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS "$URL/rest/v1/photos?select=id&limit=1" -H "apikey: $KEY"
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
