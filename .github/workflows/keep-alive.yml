# Free-plan Supabase pauses after ~7 days with no activity. A tiny read every
# 3 days resets that timer.
name: Keep Supabase awake

on:
  schedule:
    - cron: "0 9 */3 * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/keep-alive.yml]

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS "$URL/rest/v1/photos?select=id&limit=1" -H "apikey: $KEY"
        env:
          # Both values are public by design (already shipped in the site bundle).
          URL: https://sjlwhwtpfaspaaegnzvb.supabase.co
          KEY: sb_publishable_rWYxZ3wQeIylfOBHnNQtlA_HhGK__MA
